# Environnement de développement identique pour les 5 membres.
#   docker compose up --build      → http://localhost:8000
services:
  web:
    build:
      context: .
      args:
        REQUIREMENTS: requirements/dev.txt
    image: cargohub-dev
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      HF_HOME: /home/cargohub/.cache/huggingface
    volumes:
      - .:/app            # le code de votre PC est utilisé directement (rechargement auto)
      - hfcache:/home/cargohub/.cache/huggingface
    ports:
      - "8000:8000"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    image: cargohub-dev     # réutilise l'image construite par « web » (une seule construction)
    pull_policy: never
    command: celery -A config worker --beat --loglevel=info --concurrency=2
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      HF_HOME: /home/cargohub/.cache/huggingface
    volumes:
      - .:/app
      - hfcache:/home/cargohub/.cache/huggingface
    healthcheck:
      disable: true
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cargohub
      POSTGRES_USER: cargohub
      POSTGRES_PASSWORD: cargohub
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Database access is internal to Compose; avoid host port 5432 conflicts.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cargohub"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
  frontend_node_modules:
  hfcache:
