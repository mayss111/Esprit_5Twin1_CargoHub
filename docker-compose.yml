# Environnement de développement identique pour les 5 membres.
#   docker compose up --build      → http://localhost:8000
services:
  web:
    build:
      context: .
      args:
        REQUIREMENTS: requirements/dev.txt
    image: cargohub-dev
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    volumes:
      - .:/app            # le code de votre PC est utilisé directement (rechargement auto)
    ports:
      - "8000:8000"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    image: cargohub-dev     # réutilise l'image construite par « web » (une seule construction)
    pull_policy: never
    command: celery -A config worker --beat --loglevel=info
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    volumes:
      - .:/app
    healthcheck:
      disable: true
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cargohub
      POSTGRES_USER: cargohub
      POSTGRES_PASSWORD: cargohub
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Database access is internal to Compose; avoid host port 5432 conflicts.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cargohub"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # SPA React de la flotte (M3) — http://localhost:5173, proxy /api → web
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_PROXY_TARGET: http://web:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - web

volumes:
  pgdata:
  frontend_node_modules:
