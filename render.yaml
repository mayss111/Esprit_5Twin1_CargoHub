# Blueprint Render : crée le site, la base PostgreSQL et Redis en une fois.
# Render → New → Blueprint → choisir le dépôt GitHub. Voir docs/DEPLOIEMENT.md.
services:
  - type: web
    name: cargohub
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    healthCheckPath: /sante/
    autoDeployTrigger: checksPass   # déploie seulement si la CI GitHub est verte
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost
      - key: RUN_CELERY_IN_WEB
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: cargohub-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: cargohub-redis
          property: connectionString
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: openai/gpt-oss-120b
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      # L'offre gratuite n'a pas la mémoire pour Sentence Transformers. Le classement lexical prend le relais.
      - key: SENTENCE_TRANSFORMERS_ACTIF
        value: "0"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLIC_KEY
        sync: false
      # Emails (M1 — « Mot de passe oublié ») : sans ces variables, Django n'envoie rien (backend console).
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD   # mot de passe d'application Gmail, jamais dans Git
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false

  - type: keyvalue
    name: cargohub-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: noeviction
    ipAllowList: []   # accessible seulement depuis les services Render

databases:
  - name: cargohub-db
    plan: free
    region: frankfurt
    databaseName: cargohub
    user: cargohub
