# Intégration continue : à chaque push et Pull Request.
# Render ne déploie la branche main que si ce workflow est vert (autoDeployTrigger: checksPass).
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  qualite:
    name: Lint et formatage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install ruff==0.17.1
      - run: ruff check .
      - run: ruff format --check .

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - name: Migrations à jour ?
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - run: pytest --cov --cov-report=term --cov-report=html
      - name: Rapport de couverture (téléchargeable depuis l'onglet Actions)
        uses: actions/upload-artifact@v4
        with:
          name: couverture
          path: htmlcov/

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: [qualite, tests]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: cargohub:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
