{% extends "base.html" %}
{% load cargohub %}
{% block title %}{% tr "Supprimer le ticket" %}{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
  <div class="card card-ch p-4">
    <h1 class="page-title h3 mb-3">{% tr "Supprimer le ticket «" %} {{ ticket.sujet }} » ?</h1>
    <form method="post">{% csrf_token %}
      <div class="d-flex gap-2">
        <button class="btn btn-danger" type="submit">{% tr "Supprimer" %}</button>
        <a class="btn btn-outline-secondary" href="{% url 'messaging:ticket' ticket.pk %}">{% tr "Annuler" %}</a>
      </div>
    </form>
  </div>
</div></div>
{% endblock %}
