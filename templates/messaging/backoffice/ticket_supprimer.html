{% extends "backoffice/base.html" %}
{% block title %}Supprimer le ticket{% endblock %}
{% block content %}
<h1 class="page-title mb-3">Supprimer le ticket « {{ ticket.sujet }} » ?</h1>
<div class="card card-ch p-4" style="max-width: 40rem">
  <p>Le ticket et ses réponses seront définitivement supprimés.</p>
  <form method="post">{% csrf_token %}
    <div class="d-flex gap-2">
      <button class="btn btn-danger" type="submit">Supprimer</button>
      <a class="btn btn-outline-secondary" href="{% url 'bo_messaging:ticket' ticket.pk %}">Annuler</a>
    </div>
  </form>
</div>
{% endblock %}
