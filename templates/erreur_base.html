{% load static %}<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block code %}{% endblock %} · CargoHub</title>
  <link rel="icon" href="{% static 'img/icone.svg' %}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'css/cargohub.css' %}" rel="stylesheet">
</head>
<body>
<header class="navbar-ch py-3">
  <div class="container"><a href="/"><img src="{% static 'img/logo-sombre.svg' %}" alt="CargoHub, retour à l'accueil" height="38"></a></div>
</header>
<main class="container py-5 text-center" id="contenu">
  <p class="kicker">Erreur {% block code2 %}{% endblock %}</p>
  <h1 class="page-title display-5">{% block titre %}{% endblock %}</h1>
  <p class="lead text-muted mt-3">{% block texte %}{% endblock %}</p>
  <a href="/" class="btn btn-primary mt-3">Retour à l'accueil</a>
</main>
</body>
</html>
