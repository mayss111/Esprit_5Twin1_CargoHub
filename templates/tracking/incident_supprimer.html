{% extends "base.html" %}
{% block title %}Supprimer l’incident{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
  <div class="card card-ch p-4">
    <h1 class="page-title h3 mb-3">Supprimer cet incident ?</h1>
    <p>{{ incident.get_type_display }} — {{ incident.description }}</p>
    <form method="post">{% csrf_token %}
      <div class="d-flex flex-wrap gap-2">
        <button class="btn btn-danger" type="submit">Supprimer</button>
        <a class="btn btn-outline-secondary" href="{% url 'tracking:detail' incident.reservation_id %}">Annuler</a>
      </div>
    </form>
  </div>
</div></div>
{% endblock %}
