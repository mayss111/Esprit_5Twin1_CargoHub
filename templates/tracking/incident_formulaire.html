{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Modifier l’incident{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-7">
  <h1 class="page-title h3 mb-3">Modifier l’incident</h1>
  <form method="post" class="card card-ch p-4" novalidate data-controle>{% csrf_token %}
    {{ form|crispy }}
    <div class="d-flex flex-wrap gap-2">
      <button class="btn btn-primary" type="submit">Enregistrer</button>
      <a class="btn btn-outline-secondary" href="{% url 'tracking:detail' incident.reservation_id %}">Annuler</a>
    </div>
  </form>
</div></div>
{% endblock %}
