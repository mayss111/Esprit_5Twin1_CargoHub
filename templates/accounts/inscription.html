{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Inscription{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
  <div class="card card-ch p-4">
    <h1 class="page-title h3 mb-3">Créer un compte</h1>
    <form method="post">{% csrf_token %}
      {{ form|crispy }}
      <button class="btn btn-accent w-100" type="submit">Créer mon compte</button>
    </form>
    <p class="mt-3 mb-0 text-center small">Déjà inscrit ? <a href="{% url 'accounts:connexion' %}">Se connecter</a></p>
  </div>
</div></div>
{% endblock %}
