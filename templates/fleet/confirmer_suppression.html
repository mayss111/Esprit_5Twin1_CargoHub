{% extends "base.html" %}
{% block title %}Supprimer le véhicule{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h1 class="page-title mb-3">Supprimer le véhicule</h1>
    <div class="card card-ch p-4">
      <p>Confirmez-vous la suppression de <strong>{{ object }}</strong> ?</p>
      <form method="post" class="d-flex gap-2">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Oui, supprimer</button>
        <a href="/flotte/vehicules/" class="btn btn-outline-secondary">Annuler</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
