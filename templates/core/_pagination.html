{% load cargohub %}
{% if is_paginated %}
  <nav aria-label="{% tr "Pagination" %}"><ul class="pagination">
    {% if page_obj.has_previous %}<li class="page-item"><a class="page-link" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&amp;{% endif %}{% endfor %}page={{ page_obj.previous_page_number }}">{% tr "Précédent" %}</a></li>{% endif %}
    <li class="page-item disabled"><span class="page-link">{% tr "Page" %} {{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span></li>
    {% if page_obj.has_next %}<li class="page-item"><a class="page-link" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&amp;{% endif %}{% endfor %}page={{ page_obj.next_page_number }}">{% tr "Suivant" %}</a></li>{% endif %}
  </ul></nav>
{% endif %}
